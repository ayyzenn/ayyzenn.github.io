baseURL = 'https://ayyzenn.github.io/'
languageCode = 'en-us'
title = 'ayyzenn'

theme = 'hugo-PaperMod'

[params]
    dateform        = "Jan 2, 2006"
    dateformShort   = "Jan 2"
    dateformNum     = "2006-01-02"
    dateformNumTime = "2006-01-02 15:04"
    ShowToc = true
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    taglist = true
    defaultTheme = 'auto'
    lazyLoadImages = true
    mainSections = ["posts"]

[params.profileMode]
    enabled = true
    title = "Saad Ahmad"
    subtitle = "arch · i3 · notes"
    imageUrl = "img3.jpeg"
    imageTitle = "Saad Ahmad"
    imageWidth = 280
    imageHeight = 280

[[params.profileMode.buttons]]
    name = "about"
    url = "/about"

[[params.profileMode.buttons]]
    name = "posts"
    url = "/posts"

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/ayyzenn"

[[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/s-ayyzenn"

[[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "/posts/"
    weight     = 100

[[menu.main]]
    name       = "Tags"
    identifier = "tags"
    url        = "/tags/"
    weight     = 200

[[menu.main]]
    name   = "Search"
    url    = "/search"
    weight = 300

[outputs]
    home = ["HTML", "RSS", "JSON"]
